name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.44.0

      - name: Resolve build metadata
        run: |
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build representative release image
        run: |
          docker build \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t kube-memlens:release-scan .

      - name: Scan representative release image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy"
          ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln
          kube-memlens:release-scan

      - name: Build archives and SBOMs without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --skip=publish

      - name: Validate archives and SBOMs
        run: |
          archive_count=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          sbom_count=$(find dist -maxdepth 1 -type f -name '*.sbom.json' | wc -l | tr -d ' ')
          test "$archive_count" = 6
          test "$sbom_count" = 6
          (cd dist && sha256sum --check checksums.txt)
          for sbom in dist/*.sbom.json; do
            jq -e '
              .spdxVersion == "SPDX-2.3" and
              (.packages | type == "array" and length > 0) and
              any(.creationInfo.creators[]; . == "Tool: syft-1.44.0")
            ' "$sbom" >/dev/null
          done
          if grep -F "$GITHUB_WORKSPACE" dist/*.sbom.json; then
            echo "release SBOM contains the local workspace path"
            exit 1
          fi

      - name: Render Krew manifest
        run: hack/render-krew-manifest.sh "$GITHUB_REF_NAME" dist/checksums.txt dist/memlens.yaml

      - name: Package Helm chart
        run: |
          cp -R charts/kube-memlens /tmp/kube-memlens-release-chart
          sed -i "s#image: ghcr.io/danushkastanley/kube-memlens:.*#image: ghcr.io/danushkastanley/kube-memlens:${CHART_VERSION}#" \
            /tmp/kube-memlens-release-chart/Chart.yaml
          grep -F "image: ghcr.io/danushkastanley/kube-memlens:${CHART_VERSION}" \
            /tmp/kube-memlens-release-chart/Chart.yaml
          docker run --rm \
            -v "$PWD:/work" \
            -v /tmp/kube-memlens-release-chart:/release-chart:ro \
            -w /work \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            package /release-chart \
            --destination dist \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION"

      - name: Add chart and Krew checksums
        run: |
          (
            cd dist
            sha256sum "kube-memlens-${CHART_VERSION}.tgz" memlens.yaml >> checksums.txt
            sha256sum --check checksums.txt
          )

      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Sign and draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve build metadata
        run: |
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Validate downloaded bundle
        run: |
          archive_count=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          sbom_count=$(find dist -maxdepth 1 -type f -name '*.sbom.json' | wc -l | tr -d ' ')
          test "$archive_count" = 6
          test "$sbom_count" = 6
          test -f "dist/kube-memlens-${IMAGE_VERSION}.tgz"
          (cd dist && sha256sum --check checksums.txt)

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl --silent --show-error \
            --output /tmp/release-check.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          case "$status" in
            404)
              ;;
            200)
              echo "release ${GITHUB_REF_NAME} already exists; use a new version"
              exit 1
              ;;
            *)
              message=$(jq -r '.message // "unknown GitHub API error"' /tmp/release-check.json)
              echo "release preflight failed with HTTP ${status}: ${message}"
              exit 1
              ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing image tag
        env:
          IMAGE: ghcr.io/danushkastanley/kube-memlens
        run: |
          set +e
          output=$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_VERSION}" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "image ${IMAGE}:${IMAGE_VERSION} already exists; use a new version"
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown' <<< "$output"; then
            echo "image preflight failed: ${output}"
            exit 1
          fi

      - name: Log Helm in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/kube-memlens-helm
          printf '%s' "$GH_TOKEN" | docker run --rm -i \
            -e HELM_REGISTRY_CONFIG=/helm/config.json \
            -v /tmp/kube-memlens-helm:/helm \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Refuse an existing chart version
        run: |
          set +e
          output=$(docker run --rm \
            -e HELM_REGISTRY_CONFIG=/helm/config.json \
            -v /tmp/kube-memlens-helm:/helm \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            show chart oci://ghcr.io/danushkastanley/charts/kube-memlens \
            --version "$IMAGE_VERSION" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "chart kube-memlens:${IMAGE_VERSION} already exists; use a new version"
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown' <<< "$output"; then
            echo "chart preflight failed: ${output}"
            exit 1
          fi

      - name: Sign checksums
        run: |
          cosign sign-blob --yes \
            --bundle=dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      - name: Attest release files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tgz
            dist/*.sbom.json
            dist/checksums.txt
            dist/memlens.yaml

      - name: Create unique draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          release_flags=(--draft --verify-tag --title "$VERSION" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$VERSION" \
            dist/kube-memlens_*.tar.gz \
            dist/kube-memlens_*.zip \
            dist/*.sbom.json \
            dist/checksums.txt \
            dist/checksums.txt.sigstore.json \
            "dist/kube-memlens-${IMAGE_VERSION}.tgz" \
            dist/memlens.yaml \
            "${release_flags[@]}" \
            --notes 'Verify checksums, signatures and provenance before installation.'

      - name: Build and push multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/danushkastanley/kube-memlens:${{ env.IMAGE_VERSION }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: mode=max
          sbom: true

      - name: Sign image
        env:
          IMAGE: ghcr.io/danushkastanley/kube-memlens
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/danushkastanley/kube-memlens
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Push and sign Helm chart
        id: chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chart_version="${VERSION#v}"
          output=$(docker run --rm \
            -e HELM_REGISTRY_CONFIG=/helm/config.json \
            -v /tmp/kube-memlens-helm:/helm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            push "dist/kube-memlens-${chart_version}.tgz" \
            oci://ghcr.io/danushkastanley/charts 2>&1)
          printf '%s\n' "$output"
          chart_digest=$(grep -Eo 'sha256:[0-9a-f]{64}' <<< "$output" | tail -1)
          printf 'Resolved chart digest: %s\n' "$chart_digest"
          grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$chart_digest"
          cosign sign --yes "ghcr.io/danushkastanley/charts/kube-memlens@${chart_digest}"
          echo "digest=${chart_digest}" >> "$GITHUB_OUTPUT"

      - name: Record published subjects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          chart_version="${VERSION#v}"
          {
            echo "image=ghcr.io/danushkastanley/kube-memlens@${IMAGE_DIGEST}"
            echo "chart=ghcr.io/danushkastanley/charts/kube-memlens@${CHART_DIGEST}"
          } > dist/release-subjects.txt
          gh release upload "$VERSION" dist/release-subjects.txt
