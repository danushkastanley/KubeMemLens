name: Release

on:
  push:
    tags:
      - 'v*-alpha.*'
      - 'v*-beta.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/danushkastanley/kube-memlens
  CHART_REPOSITORY: ghcr.io/danushkastanley/charts/kube-memlens
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.2@sha256:0f75798d450d0cc0ea3700c79d929ae7609fb7d0e627673c14be8a484587c9b1

jobs:
  build:
    name: Build and validate release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.49.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Install pinned Helm
        run: |
          tools_dir="${RUNNER_TEMP}/kube-memlens-build-tools"
          hack/release/install_helm.sh "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Resolve and validate release identity
        run: |
          {
            echo "BUILD_DATE=$(git show -s --format=%cI HEAD)"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "CHART_VERSION=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_ENV"
          hack/release/validate_tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Check release documentation
        run: |
          hack/check-support-contract.sh
          hack/check-release-contract.sh
          chart_version=$(awk '$1 == "version:" {print $2; exit}' charts/kube-memlens/Chart.yaml)
          app_version=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2; exit}' charts/kube-memlens/Chart.yaml)
          # shellcheck disable=SC2153 # Populated through GITHUB_ENV by the previous step.
          test "$chart_version" = "$CHART_VERSION"
          test "$app_version" = "$CHART_VERSION"
          grep -Fq "$GITHUB_REF_NAME" README.md
          grep -Fq "## ${CHART_VERSION} - " CHANGELOG.md
          grep -Fq -- "--version ${CHART_VERSION}" docs/installation.md

      - name: Build archives and per-platform SBOMs without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --skip=publish

      - name: Validate archives and SBOMs
        run: |
          archive_count=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          sbom_count=$(find dist -maxdepth 1 -type f -name 'kube-memlens_*.sbom.json' | wc -l | tr -d ' ')
          test "$archive_count" = 6
          test "$sbom_count" = 6
          (cd dist && sha256sum --check checksums.txt)
          for sbom in dist/kube-memlens_*.sbom.json; do
            jq -e '
              .spdxVersion == "SPDX-2.3" and
              (.packages | type == "array" and length > 0) and
              any(.creationInfo.creators[]; . == "Tool: syft-1.44.0")
            ' "$sbom" >/dev/null
          done
          if grep -F "$GITHUB_WORKSPACE" dist/*.sbom.json; then
            echo "release SBOM contains the local workspace path"
            exit 1
          fi

      - name: Build multi-architecture image once
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/kube-memlens-image.tar,rewrite-timestamp=true,compatibility-version=30
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: false
          sbom: false

      - name: Validate build-once OCI image
        run: |
          image_digest=$(hack/release/validate_oci_archive.py \
            "${RUNNER_TEMP}/kube-memlens-image.tar" \
            --version "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --build-date "$BUILD_DATE" \
            --attestations none)
          test "$image_digest" = "${{ steps.image.outputs.digest }}"
          printf '%s\n' "$image_digest" > "${RUNNER_TEMP}/image-digest.txt"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}:/work:ro" \
            "$SKOPEO_IMAGE" \
            copy --override-arch amd64 \
            oci-archive:/work/kube-memlens-image.tar \
            docker-daemon:kube-memlens:release-scan
          image=kube-memlens:release-scan
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$GITHUB_REF_NAME"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" = "$BUILD_DATE"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/danushkastanley/KubeMemLens
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = Apache-2.0

      - name: Scan the exact release image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy"
          ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln
          kube-memlens:release-scan

      - name: Render Krew manifest
        run: hack/render-krew-manifest.sh "$GITHUB_REF_NAME" dist/checksums.txt dist/memlens.yaml

      - name: Package and validate Helm chart
        run: |
          cp -R charts/kube-memlens "${RUNNER_TEMP}/kube-memlens-release-chart"
          sed -i "s#image: ghcr.io/danushkastanley/kube-memlens:.*#image: ${IMAGE_REPOSITORY}:${CHART_VERSION}#" \
            "${RUNNER_TEMP}/kube-memlens-release-chart/Chart.yaml"
          helm lint --strict "${RUNNER_TEMP}/kube-memlens-release-chart"
          helm template kube-memlens "${RUNNER_TEMP}/kube-memlens-release-chart" \
            --namespace kube-memlens >/dev/null
          python3 hack/release/package_chart.py \
            "${RUNNER_TEMP}/kube-memlens-release-chart" \
            "dist/kube-memlens-${CHART_VERSION}.tgz" \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            --epoch "$SOURCE_DATE_EPOCH"
          python3 hack/verify_chart_archive.py \
            "dist/kube-memlens-${CHART_VERSION}.tgz" \
            "${RUNNER_TEMP}/kube-memlens-release-chart"

      - name: Generate chart SBOM and finalise build bundle
        run: |
          for platform in linux/amd64 linux/arm64; do
            platform_name=${platform//\//-}
            syft "oci-archive:${RUNNER_TEMP}/kube-memlens-image.tar" \
              --platform "$platform" \
              --source-name "kube-memlens-${platform_name}" \
              --source-version "$GITHUB_REF_NAME" \
              -o "spdx-json=dist/kube-memlens-${CHART_VERSION}.image-${platform_name}.sbom.json"
          done
          syft "file:dist/kube-memlens-${CHART_VERSION}.tgz" \
            --source-name kube-memlens-chart \
            --source-version "$GITHUB_REF_NAME" \
            -o "spdx-json=dist/kube-memlens-${CHART_VERSION}.chart.sbom.json"
          sbom_count=$(find dist -maxdepth 1 -type f \
            -name "kube-memlens-${CHART_VERSION}.*.sbom.json" | wc -l | tr -d ' ')
          test "$sbom_count" = 3
          for sbom in "dist/kube-memlens-${CHART_VERSION}."*.sbom.json; do
            jq -e '
              .spdxVersion == "SPDX-2.3" and
              (.packages | type == "array" and length > 0) and
              any(.creationInfo.creators[]; . == "Tool: syft-1.49.0")
            ' "$sbom" >/dev/null
            if grep -Fq "$RUNNER_TEMP" "$sbom" || grep -Fq "$GITHUB_WORKSPACE" "$sbom"; then
              echo "SBOM contains a runner-local path: ${sbom}" >&2
              exit 1
            fi
          done
          (
            cd dist
            sha256sum \
              "kube-memlens-${CHART_VERSION}.tgz" \
              "kube-memlens-${CHART_VERSION}.chart.sbom.json" \
              "kube-memlens-${CHART_VERSION}.image-linux-amd64.sbom.json" \
              "kube-memlens-${CHART_VERSION}.image-linux-arm64.sbom.json" \
              memlens.yaml >> checksums.txt
            sha256sum --check checksums.txt
            mkdir -p internal
            cp "${RUNNER_TEMP}/kube-memlens-image.tar" internal/kube-memlens-image.tar
            cp "${RUNNER_TEMP}/image-digest.txt" internal/image-digest.txt
            sha256sum internal/kube-memlens-image.tar internal/image-digest.txt checksums.txt \
              > internal/transfer-checksums.txt
            sha256sum --check internal/transfer-checksums.txt
          )

      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish and sign immutable subjects
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
      chart-digest: ${{ steps.chart.outputs.digest }}
    steps:
      - name: Check out repository without a persisted write credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Install pinned Helm
        run: |
          tools_dir="${RUNNER_TEMP}/kube-memlens-publish-tools"
          hack/release/install_helm.sh "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Resolve and validate downloaded bundle
        run: |
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          hack/release/validate_tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
          (
            cd dist
            sha256sum --check internal/transfer-checksums.txt
            sha256sum --check checksums.txt
          )
          image_digest=$(hack/release/validate_oci_archive.py \
            dist/internal/kube-memlens-image.tar \
            --version "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --build-date "$(git show -s --format=%cI HEAD)" \
            --attestations none)
          test "$image_digest" = "$(cat dist/internal/image-digest.txt)"

      - name: Refuse existing release destinations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl --silent --show-error \
            --output /tmp/release-check.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          case "$status" in
            404) ;;
            200)
              echo "release ${GITHUB_REF_NAME} already exists; use a new version"
              exit 1
              ;;
            *)
              message=$(jq -r '.message // "unknown GitHub API error"' /tmp/release-check.json)
              echo "release preflight failed with HTTP ${status}: ${message}"
              exit 1
              ;;
          esac
          set +e
          image_output=$(docker run --rm "$SKOPEO_IMAGE" \
            inspect "docker://${IMAGE_REPOSITORY}:${CHART_VERSION}" 2>&1)
          image_status=$?
          chart_output=$(helm show chart "oci://${CHART_REPOSITORY}" --version "$CHART_VERSION" 2>&1)
          chart_status=$?
          set -e
          if [ "$image_status" -eq 0 ]; then
            echo "image ${IMAGE_REPOSITORY}:${CHART_VERSION} already exists; use a new version"
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown' <<< "$image_output"; then
            echo "image preflight failed: ${image_output}"
            exit 1
          fi
          if [ "$chart_status" -eq 0 ]; then
            echo "chart ${CHART_REPOSITORY}:${CHART_VERSION} already exists; use a new version"
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown' <<< "$chart_output"; then
            echo "chart preflight failed: ${chart_output}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Helm in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/kube-memlens-helm"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io \
            --registry-config "${RUNNER_TEMP}/kube-memlens-helm/config.json" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Promote exact OCI image archive
        id: image
        run: |
          expected_digest=$(cat dist/internal/image-digest.txt)
          docker run --rm \
            -v "$PWD/dist:/work:ro" \
            -v "${DOCKER_CONFIG:-$HOME/.docker}:/auth:ro" \
            "$SKOPEO_IMAGE" \
            copy --all --preserve-digests \
            --authfile /auth/config.json \
            oci-archive:/work/internal/kube-memlens-image.tar \
            "docker://${IMAGE_REPOSITORY}:${CHART_VERSION}"
          published_digest=$(docker run --rm \
            -v "${DOCKER_CONFIG:-$HOME/.docker}:/auth:ro" \
            "$SKOPEO_IMAGE" \
            inspect --raw --authfile /auth/config.json \
            "docker://${IMAGE_REPOSITORY}:${CHART_VERSION}" | sha256sum | awk '{print "sha256:" $1}')
          test "$published_digest" = "$expected_digest"
          echo "IMAGE_DIGEST=$published_digest" >> "$GITHUB_ENV"
          echo "digest=$published_digest" >> "$GITHUB_OUTPUT"

      - name: Sign image
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Add GitHub image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/danushkastanley/kube-memlens
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Push and sign exact Helm package
        id: chart
        run: |
          output=$(helm push "dist/kube-memlens-${CHART_VERSION}.tgz" \
            oci://ghcr.io/danushkastanley/charts \
            --registry-config "${RUNNER_TEMP}/kube-memlens-helm/config.json" 2>&1)
          printf '%s\n' "$output"
          chart_digest=$(grep -Eo 'sha256:[0-9a-f]{64}' <<< "$output" | tail -1)
          grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$chart_digest"
          cosign sign --yes "${CHART_REPOSITORY}@${chart_digest}"
          echo "CHART_DIGEST=$chart_digest" >> "$GITHUB_ENV"
          echo "digest=$chart_digest" >> "$GITHUB_OUTPUT"

      - name: Add GitHub chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/danushkastanley/charts/kube-memlens
          subject-digest: ${{ env.CHART_DIGEST }}
          push-to-registry: true

      - name: Finalise and sign release subject inventory
        run: |
          {
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
            echo "chart=${CHART_REPOSITORY}@${CHART_DIGEST}"
          } > dist/release-subjects.txt
          (
            cd dist
            sha256sum release-subjects.txt >> checksums.txt
            sha256sum --check checksums.txt
          )
          cosign sign-blob --yes \
            --bundle=dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      - name: Attest final release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tgz
            dist/*.sbom.json
            dist/checksums.txt
            dist/memlens.yaml
            dist/release-subjects.txt

      - name: Upload final signed bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-bundle-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tgz
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/memlens.yaml
            dist/release-subjects.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify:
    name: Verify as a clean read-only consumer
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Check out repository without a persisted write credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download final signed bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-bundle-${{ github.sha }}
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Install pinned clean-consumer tools
        run: |
          tools_dir="${RUNNER_TEMP}/kube-memlens-consumer-tools"
          hack/release/install_consumer_tools.sh "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Verify as a clean consumer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BUNDLE_DIR: dist
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_IMAGE: ghcr.io/danushkastanley/kube-memlens
          RELEASE_IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          RELEASE_CHART: ghcr.io/danushkastanley/charts/kube-memlens
          RELEASE_CHART_DIGEST: ${{ needs.publish.outputs.chart-digest }}
          RELEASE_CERTIFICATE_IDENTITY: https://github.com/danushkastanley/KubeMemLens/.github/workflows/release.yml@${{ github.ref }}
        run: hack/release/verify_consumer.sh

  draft:
    name: Create complete draft release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out release helper without a persisted write credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified signed bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-bundle-${{ github.sha }}
          path: dist

      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BUNDLE_DIR: dist
          RELEASE_VERSION: ${{ github.ref_name }}
        run: hack/release/create_draft.sh
