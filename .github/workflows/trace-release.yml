name: Trace release dry run

on:
  pull_request:
    paths:
      - .github/workflows/trace-release.yml
      - internal/**
      - prototype/trace/**
      - charts/kube-memlens-trace/**
      - hack/trace-release/**
      - hack/trace-chart-contract/**
      - hack/test-trace-chart-contract.sh
      - go.mod
      - go.sum
      - LICENSE
      - NOTICE
  workflow_dispatch:

# This workflow has no publication, OIDC, package-write or deployment job.
permissions: {}

concurrency:
  group: trace-release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reproduce optional trace development bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      public-key-sha256: ${{ steps.identity.outputs.public-key-sha256 }}
      manifest-sha256: ${{ steps.identity.outputs.manifest-sha256 }}
      source-commit: ${{ steps.identity.outputs.source-commit }}
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            prototype/trace/go.sum
            prototype/trace/worker/go.sum
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.49.0
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Set up pinned BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Test non-loading release tools
        run: |
          python3 -m unittest discover -s hack/trace-release -p 'test_*.py'
          go -C prototype/trace test -race ./releasebundle ./cmd/inspect-trace-release ./cmd/sign-trace-engine
          go -C prototype/trace vet ./releasebundle ./cmd/inspect-trace-release ./cmd/sign-trace-engine
          go -C prototype/trace build -trimpath -o "$RUNNER_TEMP/inspect-trace-release" ./cmd/inspect-trace-release
      - name: Reproduce, scan and locally sign the development bundle
        run: |
          python3 hack/trace-release/dry_run.py \
            --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/trace-dry-run" \
            --module-cache "$(go env GOMODCACHE)" --version 0.1.0-dev.1 \
            --inspector "$RUNNER_TEMP/inspect-trace-release" \
            --syft "$(command -v syft)" --cosign "$(command -v cosign)"
      - name: Retain independently transferred verification identities
        id: identity
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP'])/'trace-dry-run/public/build-summary.json').read_text())
          assert value['sourceCommit'] == os.environ['GITHUB_SHA']
          assert value['releaseVersion'] == '0.1.0-dev.1'
          pairs = [('public-key-sha256', value['publicKeySHA256'], 64),
                   ('manifest-sha256', value['manifestSHA256'], 64),
                   ('source-commit', value['sourceCommit'], 40)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, digest, length in pairs:
                  assert re.fullmatch('[a-f0-9]{'+str(length)+'}', digest)
                  output.write(name+'='+digest+'\n')
          PY
      - name: Upload only public development assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trace-dry-run/public/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  consumer:
    name: Verify trace bundle on a clean consumer
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact verifier source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source-commit }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            prototype/trace/go.sum
      - name: Download exact development bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trace-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trace-input
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Build and pin consumer tools
        run: |
          tools_dir="$RUNNER_TEMP/trace-consumer-tools"
          hack/release/install_helm.sh "$tools_dir"
          go build -trimpath -o "$tools_dir/chart-checker" ./hack/trace-chart-contract
          go -C prototype/trace build -trimpath -o "$tools_dir/inspector" ./cmd/inspect-trace-release
      - name: Verify before any installation
        env:
          EXPECTED_PUBLIC_KEY_SHA256: ${{ needs.build.outputs.public-key-sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
        run: python3 hack/trace-release/ci_consumer.py
      - name: Retain consumer result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trace-consumer-receipt.json
          if-no-files-found: error
          retention-days: 7
