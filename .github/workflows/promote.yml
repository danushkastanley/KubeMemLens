name: Promote verified candidate
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Published vX.Y.Z-rc.N candidate to promote
        required: true
        type: string
      ga_tag:
        description: Annotated vX.Y.Z tag selected as this workflow ref
        required: true
        type: string
permissions: {}
concurrency:
  group: promote-${{ inputs.ga_tag }}
  cancel-in-progress: false
env:
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:4fcfc74eb89ec72dcd8caa7fbbf2a5f77d9fe3e2f5ac9e39192702f49c6d4d1a

jobs:
  promote:
    name: Copy exact candidate subjects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-digest: ${{ steps.promote.outputs.image-digest }}
      chart-digest: ${{ steps.promote.outputs.chart-digest }}
    steps:
      - name: Check out the GA tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.ga_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch identity
        env:
          CANDIDATE_TAG_INPUT: ${{ inputs.candidate_tag }}
          GA_TAG_INPUT: ${{ inputs.ga_tag }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/tags/${GA_TAG_INPUT}"
          test "${CANDIDATE_TAG_INPUT%%-rc.*}" = "$GA_TAG_INPUT"
          hack/release/validate_tag.sh "$GA_TAG_INPUT" "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/${CANDIDATE_TAG_INPUT}^{commit}")" = "$GITHUB_SHA"

      - name: Download published candidate bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG_INPUT: ${{ inputs.candidate_tag }}
        run: |
          mkdir dist
          gh release download "$CANDIDATE_TAG_INPUT" --dir dist

      - name: Install promotion tools
        run: |
          tools_dir="${RUNNER_TEMP}/promotion-tools"
          hack/release/install_helm.sh "$tools_dir"
          hack/release/install_oras.sh "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote without rebuilding
        id: promote
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GA_TAG: ${{ inputs.ga_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hack/release/promote_candidate.sh dist

      - name: Attest promoted image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/danushkastanley/kube-memlens
          subject-digest: ${{ steps.promote.outputs.image-digest }}
          push-to-registry: true

      - name: Attest promoted chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/danushkastanley/charts/kube-memlens
          subject-digest: ${{ steps.promote.outputs.chart-digest }}
          push-to-registry: true

      - name: Attest promotion records
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/memlens.yaml
            dist/promotion-checksums.txt
            dist/promotion-subjects.txt

      - name: Upload promoted bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promoted-bundle-${{ github.sha }}-${{ inputs.ga_tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    name: Verify production destinations as a clean consumer
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Check out the GA tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.ga_tag }}
          persist-credentials: false
      - name: Download promoted bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promoted-bundle-${{ github.sha }}-${{ inputs.ga_tag }}
          path: dist
      - name: Install clean-consumer tools
        run: |
          tools_dir="${RUNNER_TEMP}/promoted-consumer-tools"
          hack/release/install_consumer_tools.sh "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Verify exact promoted artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BUNDLE_DIR: dist
          RELEASE_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_VERSION: ${{ inputs.ga_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_IMAGE: ghcr.io/danushkastanley/kube-memlens
          RELEASE_IMAGE_DIGEST: ${{ needs.promote.outputs.image-digest }}
          RELEASE_CHART: ghcr.io/danushkastanley/charts/kube-memlens
          RELEASE_CHART_DIGEST: ${{ needs.promote.outputs.chart-digest }}
          RELEASE_CERTIFICATE_IDENTITY: https://github.com/danushkastanley/KubeMemLens/.github/workflows/promote.yml@refs/tags/${{ inputs.ga_tag }}
        run: hack/release/verify_promotion.sh

  draft:
    name: Create complete promoted draft release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out promotion helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.ga_tag }}
          persist-credentials: false
      - name: Download verified promoted bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promoted-bundle-${{ github.sha }}-${{ inputs.ga_tag }}
          path: dist
      - name: Create complete promoted draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BUNDLE_DIR: dist
          RELEASE_VERSION: ${{ inputs.ga_tag }}
        run: hack/release/create_promoted_draft.sh
