name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules with bounded retry
        run: |
          source hack/lib/retry.sh
          retry_capture 3 5 go mod download >/dev/null

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Check shell script syntax
        run: bash -n hack/*.sh hack/community/*.sh hack/lib/*.sh hack/release/*.sh hack/terminal-qualification/*.sh

      - name: Check shell scripts
        run: >-
          docker run --rm
          -v "$PWD:/mnt:ro"
          -w /mnt
          koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          hack/*.sh hack/community/*.sh hack/lib/*.sh hack/release/*.sh hack/terminal-qualification/*.sh

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Test shell helpers
        run: |
          hack/test-retry.sh
          make check-scale-contract
          make check-provider-contract
          make check-terminal-contract
          make check-community-contract

      - name: Check density soak safety gate
        run: |
          if hack/soak-live-density.sh >/tmp/soak.out 2>&1; then
            echo "density soak ran without explicit acknowledgement"
            exit 1
          fi
          grep -q 'SOAK_ACKNOWLEDGE' /tmp/soak.out

      - name: Test and report statement coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          coverage="$(awk '$1 == "total:" {print $3}' coverage-summary.txt)"
          {
            echo '### Go statement coverage'
            echo
            echo "Current aggregate coverage: **${coverage}**"
            echo
            echo 'Coverage is reported for visibility; behaviour and risk determine required tests.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable vulnerabilities
        run: |
          source hack/lib/retry.sh
          retry_capture 3 5 go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 >/dev/null
          govulncheck ./...

      - name: Build commands
        run: go build ./cmd/...

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

      - name: Check release workflow policy
        run: hack/check-release-contract.sh

      - name: Check Krew manifest renderer
        run: |
          sh -n hack/render-krew-manifest.sh
          checksums=$(mktemp)
          manifest=$(mktemp)
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            echo "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  kube-memlens_0.0.0_${platform}.tar.gz" >> "$checksums"
          done
          for platform in windows_amd64 windows_arm64; do
            echo "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  kube-memlens_0.0.0_${platform}.zip" >> "$checksums"
          done
          hack/render-krew-manifest.sh v0.0.0 "$checksums" "$manifest"
          grep -q 'version: "v0.0.0"' "$manifest"
          grep -q 'sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' "$manifest"

  security:
    name: Supply-chain checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the runtime image
        run: |
          docker build \
            --build-arg VERSION=ci-security \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE=1970-01-01T00:00:00Z \
            -t kube-memlens:ci-security .

      - name: Validate runtime image metadata
        run: |
          image=kube-memlens:ci-security
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = ci-security
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" = 1970-01-01T00:00:00Z
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/danushkastanley/KubeMemLens
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = Apache-2.0

      - name: Scan Dockerfile and Kubernetes configuration
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy"
          -w /work
          ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .git .

      - name: Scan the repository for committed secrets
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy"
          -w /work
          ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          fs --exit-code 1 --scanners secret --skip-dirs .git .

      - name: Scan the built image for high and critical vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy"
          ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln
          kube-memlens:ci-security

  helm:
    name: Helm checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint chart
        run: >-
          docker run --rm
          -v "$PWD:/work"
          -w /work
          alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f
          lint --strict charts/kube-memlens

      - name: Reject values outside the chart schema
        run: |
          if docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            template kube-memlens charts/kube-memlens --set collector.replicas=2 >/tmp/schema.out 2>&1; then
            echo 'chart schema accepted an unsupported collector replica count'
            exit 1
          fi
          grep -q 'collector.replicas' /tmp/schema.out

      - name: Render default chart
        run: >-
          docker run --rm
          -v "$PWD:/work"
          -w /work
          alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f
          template kube-memlens charts/kube-memlens --namespace kube-memlens
          > /tmp/kube-memlens.yaml

      - name: Validate rendered Kubernetes resources
        run: >-
          docker run --rm -i
          ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary
          < /tmp/kube-memlens.yaml

      - name: Check exact scale and ingestion limit rendering
        run: |
          grep -q -- '--max-snapshot-bytes=8388608' /tmp/kube-memlens.yaml
          sed -n '/^        - name: agent$/,/^          volumeMounts:$/p' \
            /tmp/kube-memlens.yaml > /tmp/kube-memlens-agent.yaml
          test "$(grep -c '^              memory: 96Mi$' /tmp/kube-memlens-agent.yaml)" -eq 1
          test "$(grep -c '^              memory: 128Mi$' /tmp/kube-memlens-agent.yaml)" -eq 1
          sed -n '/^        - name: collector$/,/^          volumeMounts:$/p' \
            /tmp/kube-memlens.yaml > /tmp/kube-memlens-collector.yaml
          test "$(grep -c '^              memory: 192Mi$' /tmp/kube-memlens-collector.yaml)" -eq 1
          test "$(grep -c '^              memory: 256Mi$' /tmp/kube-memlens-collector.yaml)" -eq 1
          grep -q -- '--max-response-bytes=16777216' /tmp/kube-memlens.yaml
          grep -q -- '--read-max-concurrent=4' /tmp/kube-memlens.yaml
          grep -q 'kubernetes.io/os: linux' /tmp/kube-memlens.yaml

      - name: Check authenticated ingestion boundary
        run: |
          test "$(grep -c -- '--ingestion-mode=authenticated' /tmp/kube-memlens.yaml)" -eq 2
          if grep -q -- '--collector-url=' /tmp/kube-memlens.yaml; then
            echo 'rendered chart contains the retired collector URL' >&2
            exit 1
          fi
          if grep -q -- '--ingest-listen=' /tmp/kube-memlens.yaml; then
            echo 'rendered chart contains the retired ingestion listener' >&2
            exit 1
          fi
          if grep -q '^    - name: ingest$' /tmp/kube-memlens.yaml; then
            echo 'rendered chart contains the retired ingestion Service port' >&2
            exit 1
          fi
          grep -q '^kind: APIService$' /tmp/kube-memlens.yaml
          grep -q '^  name: v1alpha1.memory.kubememlens.io$' /tmp/kube-memlens.yaml
          grep -Eq '^  caBundle: "[A-Za-z0-9+/]' /tmp/kube-memlens.yaml
          grep -q '^  insecureSkipTLSVerify: false$' /tmp/kube-memlens.yaml
          grep -q '^    - name: https-extension$' /tmp/kube-memlens.yaml
          grep -q '^      port: 443$' /tmp/kube-memlens.yaml
          test "$(grep -c 'automountServiceAccountToken: false' /tmp/kube-memlens.yaml)" -ge 4
          test "$(grep -c 'serviceAccountToken:' /tmp/kube-memlens.yaml)" -eq 3
          if grep -q 'audience:' /tmp/kube-memlens.yaml; then
            echo 'rendered chart contains an unsupported token audience' >&2
            exit 1
          fi
          grep -q 'name: system:auth-delegator' /tmp/kube-memlens.yaml
          grep -q 'name: extension-apiserver-authentication-reader' /tmp/kube-memlens.yaml
          grep -q 'name: kube-memlens-collector-node-reader' /tmp/kube-memlens.yaml
          grep -q 'resources: \["nodes"\]' /tmp/kube-memlens.yaml
          grep -q 'verbs: \["list"\]' /tmp/kube-memlens.yaml
          grep -q '^    type: Recreate$' /tmp/kube-memlens.yaml
          grep -q '^              path: /livez$' /tmp/kube-memlens.yaml
          grep -q '^              path: /readyz$' /tmp/kube-memlens.yaml
          grep -q '^            failureThreshold: 1$' /tmp/kube-memlens.yaml
          grep -Fq -- '--expected-node-selector-json={\"kubernetes.io/os\":\"linux\"}' /tmp/kube-memlens.yaml
          grep -Fq -- '--expected-node-tolerations-json=[]' /tmp/kube-memlens.yaml
          grep -q 'resourceNames: \["v1alpha1.memory.kubememlens.io"\]' /tmp/kube-memlens.yaml
          grep -q 'resourceNames: \["kube-memlens-extension-tls"\]' /tmp/kube-memlens.yaml

      - name: Check tenant read RBAC and Service boundary
        run: |
          ruby -ryaml -e '
            documents = YAML.load_stream(File.read(ARGV.fetch(0))).compact
            by_kind = documents.group_by { |document| document.fetch("kind") }
            service = by_kind.fetch("Service").find { |item| item.dig("metadata", "name") == "kube-memlens-collector" }
            ports = service.fetch("spec").fetch("ports").map { |port| [port.fetch("name"), port.fetch("port")] }
            abort "secure Service ports differ: #{ports.inspect}" unless ports == [["https-extension", 443]]

            roles = by_kind.fetch("ClusterRole").to_h { |role| [role.dig("metadata", "name"), role] }
            expected = %w[kube-memlens-namespace-viewer kube-memlens-cluster-viewer kube-memlens-metrics-reader]
            abort "read ClusterRoles are missing" unless expected.all? { |name| roles.key?(name) }
            expected_rules = {
              "kube-memlens-namespace-viewer" => [
                [["pods"], ["get", "list"]],
                [["containers", "workloads"], ["list"]],
                [["pods/history"], ["get"]],
              ],
              "kube-memlens-cluster-viewer" => [
                [["pods"], ["get", "list"]],
                [["containers", "workloads"], ["list"]],
                [["pods/history"], ["get"]],
                [["nodes"], ["get", "list"]],
                [["clusterstatus"], ["get"]],
              ],
              "kube-memlens-metrics-reader" => [
                [["metrics"], ["get"]],
              ],
            }
            expected.each do |name|
              actual = roles.fetch(name).fetch("rules").map do |rule|
                abort "wildcard read RBAC in #{name}" if rule.fetch("apiGroups", []).include?("*") ||
                  rule.fetch("resources", []).include?("*") || rule.fetch("verbs", []).include?("*")
                abort "unexpected API group in #{name}" unless rule.fetch("apiGroups") == ["memory.kubememlens.io"]
                [rule.fetch("resources"), rule.fetch("verbs")]
              end
              abort "unexpected rules in #{name}: #{actual.inspect}" unless actual == expected_rules.fetch(name)
            end
            node_reader = roles.fetch("kube-memlens-collector-node-reader").fetch("rules")
            expected_node_reader = [{"apiGroups" => [""], "resources" => ["nodes"], "verbs" => ["list"]}]
            abort "unexpected collector Node inventory RBAC: #{node_reader.inspect}" unless node_reader == expected_node_reader

            bindings = Array(by_kind["RoleBinding"]) + Array(by_kind["ClusterRoleBinding"])
            bound = bindings.filter_map { |binding| binding.dig("roleRef", "name") }
            abort "chart bound a viewer role by default" unless (bound & expected).empty?
          ' /tmp/kube-memlens.yaml

      - name: Validate immutable image rendering
        run: |
          digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            template kube-memlens charts/kube-memlens \
            --namespace kube-memlens \
            --set-string image.repository=registry.example/kube-memlens \
            --set-string image.digest="${digest}" \
            | grep -Fq "registry.example/kube-memlens@${digest}"
          if docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            template kube-memlens charts/kube-memlens \
            --namespace kube-memlens \
            --set-string image.digest=latest; then
            echo "chart accepted a non-sha256 image digest"
            exit 1
          fi

      - name: Reject removed legacy chart values
        run: |
          if docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            template kube-memlens charts/kube-memlens \
            --namespace kube-memlens \
            --set agent.ingestionMode=legacy \
            --set metrics.serviceMonitor.enabled=true \
            > /tmp/kube-memlens-obsolete-values.out 2>&1; then
            echo 'chart schema accepted removed legacy values'
            exit 1
          fi
          grep -q 'agent.*ingestionMode' /tmp/kube-memlens-obsolete-values.out
          grep -q 'metrics.*serviceMonitor' /tmp/kube-memlens-obsolete-values.out

      - name: Validate optional Prometheus rules
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            template kube-memlens charts/kube-memlens \
            --namespace kube-memlens \
            --set metrics.prometheusRule.enabled=true \
            --show-only templates/prometheusrule.yaml \
            > /tmp/kube-memlens-prometheusrule.yaml
          ruby -e 'require "yaml"; d=YAML.safe_load(File.read(ARGV[0]), permitted_classes: [], aliases: false); File.write(ARGV[1], YAML.dump({"groups"=>d.fetch("spec").fetch("groups")}))' \
            /tmp/kube-memlens-prometheusrule.yaml /tmp/kube-memlens-rules.yaml
          docker run --rm \
            --entrypoint /bin/promtool \
            -v /tmp/kube-memlens-rules.yaml:/rules.yaml:ro \
            prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac \
            check rules /rules.yaml

      - name: Validate Grafana dashboard JSON
        run: jq -e '.title and (.panels | length == 4)' charts/kube-memlens/dashboards/kube-memlens.json >/dev/null

      - name: Reject unsafe collector replicas
        run: |
          if docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.4@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            template kube-memlens charts/kube-memlens \
            --namespace kube-memlens \
            --set collector.replicas=2; then
            echo "chart accepted an unsafe multi-replica collector"
            exit 1
          fi

  kind-e2e:
    name: kind / Kubernetes ${{ matrix.kubernetes }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: 1.35.5
            node-image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
            kubectl-version: v1.35.5
            kubectl-sha256: 90f75ea6ecc9ea5633262e1c0b83a40560003b30fc94a04cb099404fcef0c224
            tui_smoke: false
            authenticated_ingestion_smoke: false
            tenant_scoped_read_smoke: false
            tenant_isolation_smoke: false
          - kubernetes: 1.36.1
            node-image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
            kubectl-version: v1.36.1
            kubectl-sha256: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
            tui_smoke: false
            authenticated_ingestion_smoke: false
            tenant_scoped_read_smoke: false
            tenant_isolation_smoke: false
          - kubernetes: 1.37.0
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            kubectl-version: v1.37.0
            kubectl-sha256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
            tui_smoke: true
            authenticated_ingestion_smoke: true
            tenant_scoped_read_smoke: true
            tenant_isolation_smoke: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate version-aligned matrix row
        shell: bash
        run: |
          set -euo pipefail
          test "${{ matrix.kubectl-version }}" = "v${{ matrix.kubernetes }}"
          case "${{ matrix.node-image }}" in
            "kindest/node:v${{ matrix.kubernetes }}@sha256:"????????????????????????????????????????????????????????????????) ;;
            *)
              echo "node image is not an immutable Kubernetes ${{ matrix.kubernetes }} image"
              exit 1
              ;;
          esac

      - name: Install pinned cluster tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/kube-memlens-tools"
          mkdir -p "${tools_dir}"

          curl -fsSLo "${tools_dir}/kind" https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  ${tools_dir}/kind" | sha256sum --check
          chmod +x "${tools_dir}/kind"

          curl -fsSLo "${tools_dir}/helm.tar.gz" https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz
          echo "f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1  ${tools_dir}/helm.tar.gz" | sha256sum --check
          tar -xzf "${tools_dir}/helm.tar.gz" -C "${tools_dir}"
          mv "${tools_dir}/linux-amd64/helm" "${tools_dir}/helm"

          curl -fsSLo "${tools_dir}/kubectl" \
            "https://dl.k8s.io/release/${{ matrix.kubectl-version }}/bin/linux/amd64/kubectl"
          echo "${{ matrix.kubectl-sha256 }}  ${tools_dir}/kubectl" | sha256sum --check
          chmod +x "${tools_dir}/kubectl"
          echo "${tools_dir}" >> "${GITHUB_PATH}"

      - name: Install TUI smoke dependency
        if: matrix.tui_smoke
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect

      - name: Run install, diagnosis, upgrade, rollback, and uninstall
        env:
          E2E_NODE_IMAGE: ${{ matrix.node-image }}
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/kube-memlens-e2e
          E2E_RUN_DENSITY_BENCHMARKS: "true"
          E2E_RUN_LIVE_DENSITY_SMOKE: "true"
          E2E_RUN_TUI_SMOKE: ${{ matrix.tui_smoke }}
          E2E_RUN_AUTHENTICATED_INGESTION_SMOKE: ${{ matrix.authenticated_ingestion_smoke }}
          E2E_RUN_TENANT_SCOPED_READ_SMOKE: ${{ matrix.tenant_scoped_read_smoke }}
          E2E_RUN_TENANT_ISOLATION_SMOKE: ${{ matrix.tenant_isolation_smoke }}
          E2E_RUN_RELIABILITY_SMOKE: ${{ matrix.authenticated_ingestion_smoke }}
        run: hack/e2e-kind.sh

      - name: Upload sanitised density smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: density-smoke-kubernetes-${{ matrix.kubernetes }}
          path: ${{ runner.temp }}/kube-memlens-e2e/live-density-smoke/density-soak-*.json
          if-no-files-found: error
