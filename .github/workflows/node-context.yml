name: Node-context verification

on:
  pull_request:
    paths: ['internal/**', 'cmd/**', 'go.mod', 'go.sum', 'hack/verify-node-context-kind.sh', 'hack/lib/node-context-fixture.sh', 'hack/lib/node-context-ingestion.sh', 'hack/lib/node-analysis-verification.sh', 'hack/lib/node-cockpit-verification.sh', 'hack/node-cockpit-smoke.exp', 'charts/kube-memlens/**', 'Dockerfile', '.github/workflows/node-context.yml']
  push:
    branches: [main]
    paths: ['internal/**', 'cmd/**', 'go.mod', 'go.sum', 'hack/verify-node-context-kind.sh', 'hack/lib/node-context-fixture.sh', 'hack/lib/node-context-ingestion.sh', 'hack/lib/node-analysis-verification.sh', 'hack/lib/node-cockpit-verification.sh', 'hack/node-cockpit-smoke.exp', 'charts/kube-memlens/**', 'Dockerfile', '.github/workflows/node-context.yml']

permissions:
  contents: read

concurrency:
  group: node-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-kubelet:
    name: Node context / Kubernetes ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.36.1
            image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
            kubectl-sha256: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
          - version: 1.37.0
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            kubectl-sha256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned local cluster tools
        env:
          KUBECTL_VERSION: ${{ matrix.version }}
          KUBECTL_SHA256: ${{ matrix.kubectl-sha256 }}
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/node-context-tools"
          mkdir -p "${tools_dir}"
          curl -fsSLo "${tools_dir}/kind" https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  ${tools_dir}/kind" | sha256sum --check
          curl -fsSLo "${tools_dir}/kubectl" "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${tools_dir}/kubectl" | sha256sum --check
          curl -fsSLo "${tools_dir}/helm.tar.gz" https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz
          echo "f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1  ${tools_dir}/helm.tar.gz" | sha256sum --check
          tar -xzf "${tools_dir}/helm.tar.gz" -C "${tools_dir}"
          mv "${tools_dir}/linux-amd64/helm" "${tools_dir}/helm"
          chmod +x "${tools_dir}/kind" "${tools_dir}/kubectl"
          echo "${tools_dir}" >> "${GITHUB_PATH}"
      - name: Install existing PTY test dependency
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends expect
      - name: Fuzz bounded Node and Summary decoders
        run: |
          go test ./internal/nodestats -run '^$' -fuzz '^FuzzSummary$' -fuzztime=10s
          go test ./internal/nodestats -run '^$' -fuzz '^FuzzNode$' -fuzztime=10s
          go test ./internal/nodecontext -run '^$' -fuzz '^FuzzObservationDecoder$' -fuzztime=10s
          go test ./internal/extension -run '^$' -fuzz '^FuzzNodeWire$' -fuzztime=10s
          go test ./internal/nodeanalysis -run '^$' -fuzz '^FuzzNodeAnalysis$' -fuzztime=10s
          go test ./internal/incident -run '^$' -fuzz '^FuzzNodeIncidentDecoder$' -fuzztime=10s
      - name: Verify direct TLS, authenticated ingestion and reader isolation
        env:
          NODE_CONTEXT_ACKNOWLEDGE: create-and-remove-node-context-kind
          NODE_CONTEXT_VERIFY_INGESTION: "true"
          NODE_CONTEXT_NODE_IMAGE: ${{ matrix.image }}
          NODE_CONTEXT_ARTIFACT_DIR: ${{ runner.temp }}/node-context-evidence
        run: hack/verify-node-context-kind.sh
      - name: Upload sanitised result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-context-${{ matrix.version }}
          path: ${{ runner.temp }}/node-context-evidence/summary.json
          if-no-files-found: ignore
          retention-days: 14
