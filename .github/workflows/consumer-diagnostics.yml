name: Candidate consumer diagnostics

on:
  push:
    branches: [fix/release-consumer-verification]
    paths: [.github/workflows/consumer-diagnostics.yml, hack/release/verify_consumer.sh]

permissions:
  contents: read
  actions: read
  packages: read
  attestations: read

jobs:
  diagnose:
    name: Verify unchanged candidate with bounded hook preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the original signed candidate bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 12570876179
          run-id: 40118221494
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
          merge-multiple: true
      - name: Install the same pinned consumer tools
        run: |
          hack/release/install_consumer_tools.sh "$RUNNER_TEMP/consumer-tools"
          echo "$RUNNER_TEMP/consumer-tools" >> "$GITHUB_PATH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Verify signatures and complete consumer lifecycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BUNDLE_DIR: dist
          RELEASE_VERSION: v1.0.2
          RELEASE_COMMIT: f87d713ca9bf5c652495909cb5a093d69c052f9b
          RELEASE_IMAGE: ghcr.io/danushkastanley/candidates/1.0.2-rc.1/kube-memlens
          RELEASE_IMAGE_DIGEST: sha256:c0b90f51ddf82e65c86e683c802b94b79155771b4526b365a1e2dd95d905e6d6
          RELEASE_CHART: ghcr.io/danushkastanley/candidates/1.0.2-rc.1/charts/kube-memlens
          RELEASE_CHART_DIGEST: sha256:f275f692d975c22cb486f5d327c75634c241462d5d15edd817d74f8c860fb15a
          RELEASE_CERTIFICATE_IDENTITY: https://github.com/danushkastanley/KubeMemLens/.github/workflows/candidate.yml@refs/tags/v1.0.2-rc.1
          RELEASE_CANDIDATE_TAG: v1.0.2-rc.1
        run: hack/release/verify_candidate.sh
