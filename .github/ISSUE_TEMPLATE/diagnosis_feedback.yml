name: Diagnosis feedback
description: Report a false, ambiguous, or unhelpful memory explanation with redacted evidence.
title: "[Diagnosis]: "
labels: [diagnosis-feedback]
body:
  - type: markdown
    attributes:
      value: >-
        Use synthetic or redacted evidence only. Do not include kubeconfig data, credentials,
        customer names, production paths, raw Kubernetes objects, Pod UIDs, container IDs, or labels.
        Report suspected vulnerabilities privately through SECURITY.md.
  - type: dropdown
    id: feedback
    attributes:
      label: Feedback type
      options:
        - False diagnosis
        - Ambiguous explanation
        - Missing caveat or evidence
        - Unhelpful next step
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KubeMemLens version
      description: Paste `kubectl memlens version` or the exact commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Redacted environment
      description: Kubernetes, kernel, cgroup mode, runtime, provider/node-pool type, and installation method.
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Machine-readable finding
      description: >-
        Paste the smallest redacted `explain ... -o yaml` finding, including severity,
        confidence, evidenceWindow, evidence, and caveats. Replace workload and node names.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected interpretation
      description: What did independent application, kernel, or incident evidence show instead?
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Reproducible fixture
      description: >-
        Provide a minimal synthetic cgroup fixture, default-redacted incident bundle, or commands
        that reproduce the explanation without access to your cluster.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the submission and removed credentials, real identifiers, sensitive paths, labels, and workload data.
          required: true
        - label: I understand that public issue attachments and comments are visible to everyone.
          required: true
