name: Installation feedback
description: Record a privacy-safe installation outcome for a specific KubeMemLens version.
title: "[Adopter]: "
labels: [adopter-feedback]
body:
  - type: markdown
    attributes:
      value: >-
        This public form records outcomes, not provider inventory. Use family-level
        environment details only. Do not include account, project, subscription,
        cluster, node-pool, namespace, workload, host, image, or resource identifiers.
  - type: input
    id: version
    attributes:
      label: KubeMemLens version
      description: The exact release tag, image digest, or commit tested.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Helm OCI chart
        - Local chart checkout
        - Release archive or Krew
        - Source checkout
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Redacted environment
      description: >-
        Kubernetes version, provider family or self-managed, node operating-system
        family, architecture, cgroup mode, and container runtime. Do not include names or IDs.
    validations:
      required: true
  - type: dropdown
    id: install_outcome
    attributes:
      label: Installation outcome
      options:
        - Completed and produced valid diagnostic data
        - Completed with partial or stale evidence
        - Failed before workloads became ready
        - Environment was reported unsupported
    validations:
      required: true
  - type: dropdown
    id: lifecycle_outcome
    attributes:
      label: Upgrade, rollback, and uninstall outcome
      options:
        - All exercised and successful
        - Some exercised; details below
        - Not exercised
        - One or more failed; details below
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Redacted outcome
      description: >-
        Describe the useful result, partial state, unsupported reason, or error class.
        Do not paste raw logs or Kubernetes objects.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and use
      options:
        - label: I reviewed this public submission and removed credentials, real identifiers, labels, workload data, and sensitive paths.
          required: true
        - label: I understand this report is feedback, not a new provider-support qualification by itself.
          required: true
