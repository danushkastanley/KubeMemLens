apiVersion: v1
kind: PersistentVolume
metadata:
  name: kube-memlens-csi-test
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  storageClassName: ''
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: hostpath.csi.k8s.io
    volumeHandle: VOLUME_HANDLE
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: kube-memlens-csi-e2e
spec:
  volumeName: kube-memlens-csi-test
  storageClassName: ''
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Pod
metadata:
  name: persistent
  namespace: kube-memlens-csi-e2e
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: worker
      image: docker.io/library/busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      command: [sh, -c, 'exec sleep 86400']
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: data}
