apiVersion: v1
kind: Namespace
metadata:
  name: kube-memlens-trace-preflight
  labels:
    # Allows the explicit BPF/PERFMON and read-only metadata mounts below.
    # Admission to this namespace is reserved for trusted cluster administrators.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preflight
  namespace: kube-memlens-trace-preflight
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-network
  namespace: kube-memlens-trace-preflight
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-preflight
  namespace: kube-memlens-trace-preflight
rules:
- apiGroups: [""]
  resources: [pods, pods/log]
  verbs: [get, list]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-preflight
  namespace: kube-memlens-trace-preflight
subjects:
- kind: Group
  name: kube-memlens-trace-admins
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: read-preflight
  apiGroup: rbac.authorization.k8s.io
