# Reusable tenant read policy. Reference this ClusterRole from a RoleBinding in
# each namespace that a human or automation identity may inspect.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-namespace-viewer
rules:
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["containers", "workloads"]
    verbs: ["list"]
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["pods/history"]
    verbs: ["get"]
