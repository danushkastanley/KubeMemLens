version: 2

project_name: kube-memlens

builds:
  - id: kubectl-memlens
    main: ./cmd/kubectl-memlens
    binary: kubectl-memlens
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/danushkastanley/kube-memlens/internal/buildinfo.Version=v{{ .Version }}
      - -X github.com/danushkastanley/kube-memlens/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/danushkastanley/kube-memlens/internal/buildinfo.BuildDate={{ .CommitDate }}

archives:
  - ids: [kubectl-memlens]
    name_template: >-
      kube-memlens_{{ .Version }}_{{ .Os }}_{{ .Arch }}
      {{- with .Arm }}v{{ . }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      group: root
      owner: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          group: root
          owner: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info:
          group: root
          owner: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          group: root
          owner: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  disable: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
