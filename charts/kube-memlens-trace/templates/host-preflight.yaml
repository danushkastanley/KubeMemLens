{{- if .Values.enabled }}
{{- $name := include "trace.name" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-host-preflight
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: trace-host-preflight
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- range .Values.nodes }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-check-{{ .id }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 30
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name | quote }}
        app.kubernetes.io/component: trace-host-preflight
    spec:
      restartPolicy: Never
      nodeName: {{ .name | quote }}
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: {{ .architecture }}
      serviceAccountName: {{ $.Values.preflightServiceAccount | quote }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: Localhost
          localhostProfile: kube-memlens-trace/binding-node.json
      containers:
        - name: host-preflight
          image: {{ include "trace.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [doctor, --json, --timeout=10s]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [BPF, PERFMON]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
          volumeMounts:
            - {name: btf, mountPath: /sys/kernel/btf, readOnly: true}
            - {name: tracing, mountPath: /sys/kernel/tracing, readOnly: true}
            - {name: security, mountPath: /sys/kernel/security, readOnly: true}
            - {name: bpf, mountPath: /sys/fs/bpf, readOnly: true}
            - {name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true}
      volumes:
        - name: btf
          hostPath: {path: /sys/kernel/btf, type: Directory}
        - name: tracing
          hostPath: {path: /sys/kernel/tracing, type: Directory}
        - name: security
          hostPath: {path: /sys/kernel/security, type: Directory}
        - name: bpf
          hostPath: {path: /sys/fs/bpf, type: Directory}
        - name: cgroup
          hostPath: {path: /sys/fs/cgroup, type: Directory}
{{- end }}
{{- end }}
