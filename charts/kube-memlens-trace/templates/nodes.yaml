{{- if .Values.enabled }}
{{- $name := include "trace.name" . }}
{{- range .Values.nodes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-node-{{ .id }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: trace-node
      tracing.kubememlens.io/node-id: {{ .id | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name | quote }}
        app.kubernetes.io/component: trace-node
        tracing.kubememlens.io/node-id: {{ .id | quote }}
      annotations:
        tracing.kubememlens.io/qualification: unqualified-development
        checksum/installation: {{ toJson $.Values | sha256sum }}
    spec:
      nodeName: {{ .name | quote }}
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: {{ .architecture }}
      serviceAccountName: {{ $name }}-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        fsGroup: 0
        seccompProfile:
          type: Localhost
          localhostProfile: kube-memlens-trace/filecache-node.json
      containers:
        - name: binding-node
          image: {{ include "trace.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - binding-node
            - {{ printf "--node-uid=%s" .uid | quote }}
            - {{ printf "--node-name=%s" .name | quote }}
            - {{ printf "--kubelet-cgroup-root=%s" .kubeletCgroupRoot | quote }}
            - {{ printf "--expected-kernel-release=%s" .kernelVersion | quote }}
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            - --control-ca=/tls/control-ca.crt
            - {{ printf "--control-certificate-sha256=%s" $.Values.controlCertificateSHA256 | quote }}
            - --acceptance-policy=/acceptance/policy.json
            - {{ printf "--acceptance-policy-sha256=%s" $.Values.acceptancePolicySHA256 | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [BPF, PERFMON]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "2", memory: 512Mi}
          ports: [{name: https, containerPort: 9443}]
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: acceptance, mountPath: /acceptance, readOnly: true}
            - {name: btf, mountPath: /sys/kernel/btf, readOnly: true}
            - {name: tracing, mountPath: /sys/kernel/tracing, readOnly: true}
            - {name: security, mountPath: /sys/kernel/security, readOnly: true}
            - {name: bpf, mountPath: /sys/fs/bpf, readOnly: true}
            - {name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: {{ .tlsSecret | quote }}, defaultMode: 0440}
        - name: acceptance
          configMap:
            name: {{ $.Values.acceptancePolicyConfigMap | quote }}
            defaultMode: 0444
            items: [{key: policy.json, path: policy.json}]
        - name: btf
          hostPath: {path: /sys/kernel/btf, type: Directory}
        - name: tracing
          hostPath: {path: /sys/kernel/tracing, type: Directory}
        - name: security
          hostPath: {path: /sys/kernel/security, type: Directory}
        - name: bpf
          hostPath: {path: /sys/fs/bpf, type: Directory}
        - name: cgroup
          hostPath: {path: /sys/fs/cgroup, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-node-{{ .id }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: trace-node
    tracing.kubememlens.io/node-id: {{ .id | quote }}
  ports: [{name: https, port: 9443, targetPort: https}]
{{- end }}
{{- end }}
