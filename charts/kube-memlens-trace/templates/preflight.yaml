{{- if .Values.enabled }}
{{- $name := include "trace.name" . }}
{{- $spec := dict "schemaVersion" 1 "namespace" .Release.Namespace "apiServiceName" (printf "%s-api" $name) "nodeServicePrefix" (printf "%s-node" $name) "policySHA256" .Values.acceptancePolicySHA256 "controlCertificateSHA256" .Values.controlCertificateSHA256 "apiCABundle" .Values.apiCABundle "nodes" .Values.nodes | toJson }}
{{- if gt (len $spec) 65536 }}{{ fail "installation specification exceeds runtime byte limit" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-preflight
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
immutable: true
data:
  check.json: {{ $spec | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-preflight
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: trace-preflight
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.preflightServiceAccount | quote }}
      automountServiceAccountToken: true
      nodeSelector: {kubernetes.io/os: linux}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: preflight
          image: {{ include "trace.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [_install-check]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
          volumeMounts:
            - {name: specification, mountPath: /installation, readOnly: true}
            - {name: acceptance, mountPath: /acceptance, readOnly: true}
            - {name: api-trust, mountPath: /tls, readOnly: true}
            {{- range .Values.nodes }}
            - {name: node-{{ .id }}, mountPath: {{ printf "/node-trust/%s" .id | quote }}, readOnly: true}
            {{- end }}
      volumes:
        - name: specification
          configMap: {name: {{ $name }}-preflight, defaultMode: 0444}
        - name: acceptance
          configMap:
            name: {{ .Values.acceptancePolicyConfigMap | quote }}
            defaultMode: 0444
            items: [{key: policy.json, path: policy.json}]
        - name: api-trust
          secret: {secretName: {{ .Values.apiTLSSecret | quote }}, defaultMode: 0440}
        {{- range .Values.nodes }}
        - name: node-{{ .id }}
          secret:
            secretName: {{ .tlsSecret | quote }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: control-ca.crt, path: control-ca.crt}
        {{- end }}
{{- end }}
