{{- if .Values.enabled }}
{{- $name := include "trace.name" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: trace-api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: trace-api
      annotations:
        tracing.kubememlens.io/qualification: unqualified-development
        checksum/installation: {{ toJson .Values | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}-api
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      nodeSelector: {kubernetes.io/os: linux}
      securityContext:
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: admission-api
          image: {{ include "trace.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - admission-api
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            - --node-client-cert=/tls/node-client.crt
            - --node-client-key=/tls/node-client.key
            - --audit-reference-key=/audit/reference.key
            - {{ printf "--audit-reference-key-sha256=%s" .Values.auditReferenceKeySHA256 | quote }}
            - --node-registry=/registry/nodes.json
            - --node-profile-mode=pinned
            - --acceptance-policy=/acceptance/policy.json
            - {{ printf "--acceptance-policy-sha256=%s" .Values.acceptancePolicySHA256 | quote }}
            - {{ printf "--max-node-traces=%d" (int .Values.maxNodeTraces) | quote }}
            {{- if .Values.allowConfirmedPaths }}
            - --allow-confirmed-paths
            {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "2", memory: 512Mi}
          ports: [{name: https, containerPort: 8443}]
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            periodSeconds: 2
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: audit-reference, mountPath: /audit, readOnly: true}
            - {name: registry, mountPath: /registry, readOnly: true}
            - {name: acceptance, mountPath: /acceptance, readOnly: true}
      volumes:
        - name: audit-reference
          secret:
            secretName: {{ .Values.auditReferenceKeySecret | quote }}
            defaultMode: 0440
            items: [{key: reference.key, path: reference.key}]
        - name: tls
          secret: {secretName: {{ .Values.apiTLSSecret | quote }}, defaultMode: 0440}
        - name: registry
          configMap: {name: {{ $name }}-registry}
        - name: acceptance
          configMap:
            name: {{ .Values.acceptancePolicyConfigMap | quote }}
            defaultMode: 0444
            items: [{key: policy.json, path: policy.json}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  namespace: {{ .Release.Namespace | quote }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: trace-api
  ports: [{name: https, port: 8443, targetPort: https}]
{{- end }}
