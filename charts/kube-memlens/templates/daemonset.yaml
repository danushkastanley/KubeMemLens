{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-memlens-agent
  namespace: {{ .Values.namespace.name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-memlens-agent
    spec:
      serviceAccountName: kube-memlens
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/memlens-agent"]
          args:
            - "--cgroup-root=/host/sys/fs/cgroup"
            - "--interval={{ .Values.agent.interval }}"
            - "--collector-url={{ .Values.agent.collectorURL }}"
            - "--node-name=$(NODE_NAME)"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: {{ .Values.security.privileged }}
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: {{ .Values.agent.cgroupRootHostPath | quote }}
            type: Directory
        - name: proc
          hostPath:
            path: {{ .Values.agent.procRootHostPath | quote }}
            type: Directory
{{- end }}
