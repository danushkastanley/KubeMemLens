{{- if .Values.agent.enabled }}
{{- if .Values.security.privileged }}
{{- fail "security.privileged must remain false for the standard cgroup-read profile" }}
{{- end }}
{{- if not .Values.security.readOnlyRootFilesystem }}
{{- fail "security.readOnlyRootFilesystem must remain true for the standard cgroup-read profile" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-memlens-agent
  namespace: {{ .Values.namespace.name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-memlens-agent
    spec:
      serviceAccountName: kube-memlens-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
{{ toYaml .Values.agent.nodeSelector | nindent 8 }}
{{- with .Values.agent.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "kube-memlens.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/memlens-agent"]
          args:
            - "--cgroup-root=/host/sys/fs/cgroup"
            - "--interval={{ .Values.agent.interval }}"
            - "--ingestion-mode=authenticated"
            - "--node-name=$(NODE_NAME)"
{{- if .Values.agent.metrics.enabled }}
            - "--metrics-listen=127.0.0.1:{{ .Values.agent.metrics.port }}"
{{- else }}
            - "--metrics-listen="
{{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: {{ .Values.security.privileged }}
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: {{ .Values.agent.cgroupRootHostPath | quote }}
            type: Directory
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.agent.tokenExpirationSeconds }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
