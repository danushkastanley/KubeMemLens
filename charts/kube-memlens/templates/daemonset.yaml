{{- if .Values.agent.enabled }}
{{- if .Values.security.privileged }}
{{- fail "security.privileged must remain false for the standard cgroup-read profile" }}
{{- end }}
{{- if not .Values.security.readOnlyRootFilesystem }}
{{- fail "security.readOnlyRootFilesystem must remain true for the standard cgroup-read profile" }}
{{- end }}
{{- $probes := .Values.agent.probes | default dict }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-memlens-agent
  namespace: {{ .Values.namespace.name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-agent
{{- with .Values.agent.updateStrategy }}
  updateStrategy:
{{ toYaml . | nindent 4 }}
{{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-memlens-agent
{{- with .Values.agent.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: kube-memlens-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
{{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . | quote }}
{{- end }}
{{- with (include "kube-memlens.imagePullSecrets" .) }}{{ . | nindent 6 }}{{- end }}
{{- with .Values.agent.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{- end }}
      nodeSelector:
{{ toYaml .Values.agent.nodeSelector | nindent 8 }}
{{- with .Values.agent.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "kube-memlens.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/memlens-agent"]
          args:
            - "--cgroup-root=/host/sys/fs/cgroup"
            - "--interval={{ .Values.agent.interval }}"
            - "--ingestion-mode=authenticated"
            - "--node-name=$(NODE_NAME)"
{{- if .Values.agent.metrics.enabled }}
            - "--metrics-listen=127.0.0.1:{{ .Values.agent.metrics.port }}"
{{- else }}
            - "--metrics-listen="
{{- end }}
{{- if $probes.enabled }}
            - "--health-listen=:{{ $probes.port | default 8083 }}"
            - "--liveness-window={{ $probes.livenessWindow | default "2m" }}"
          ports:
            - name: health
              containerPort: {{ $probes.port | default 8083 }}
          # /livez fails when the scan loop has made no attempt within the
          # liveness window. /healthz only says the process answers.
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
{{- end }}
          env:
            - name: GODEBUG
              value: disablethp=1
{{- with (include "kube-memlens.agentGoMemLimit" .) }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
{{- end }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: {{ .Values.security.privileged }}
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: {{ .Values.agent.cgroupRootHostPath | quote }}
            type: Directory
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.agent.tokenExpirationSeconds }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
