apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The agent GETs only the node it is scheduled on and caches the result.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # Follow only controller owners needed for Pod -> top-level workload context.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
{{- if eq .Values.agent.ingestionMode "authenticated" }}
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["ingestionepochs"]
    verbs: ["get"]
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["nodesnapshots"]
    verbs: ["create"]
{{- end }}
