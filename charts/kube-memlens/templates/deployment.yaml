{{- if .Values.collector.enabled }}
{{- if ne (int .Values.collector.replicas) 1 }}
{{- fail "collector.replicas must be 1 while the collector uses an in-memory per-instance store" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-memlens-collector
  namespace: {{ .Values.namespace.name | quote }}
spec:
  replicas: {{ .Values.collector.replicas }}
  # One in-memory generation may serve at a time. RollingUpdate would route
  # reads and agent epochs across two independent stores during an upgrade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-memlens-collector
    spec:
      serviceAccountName: kube-memlens-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ include "kube-memlens.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/memlens-collector"]
          args:
            - "--listen=:{{ .Values.collector.service.port }}"
            - "--ingestion-mode=authenticated"
            - "--extension-port={{ .Values.collector.ingestion.extensionPort }}"
            - "--extension-tls-cert-file=/var/run/kube-memlens/tls/tls.crt"
            - "--extension-tls-key-file=/var/run/kube-memlens/tls/tls.key"
            - "--agent-username=system:serviceaccount:{{ .Values.namespace.name }}:kube-memlens-agent"
            - "--ingestion-max-concurrent={{ .Values.collector.ingestion.maxConcurrentRequests }}"
            - "--ingestion-requests-per-second-per-agent={{ .Values.collector.ingestion.requestsPerSecondPerAgent }}"
            - "--ingestion-burst-per-agent={{ .Values.collector.ingestion.burstPerAgent }}"
            - "--snapshot-ttl={{ .Values.collector.snapshotTTL }}"
            - {{ printf "--expected-node-selector-json=%s" (toJson .Values.agent.nodeSelector) | quote }}
            - {{ printf "--expected-node-tolerations-json=%s" (toJson .Values.agent.tolerations) | quote }}
            - "--read-max-concurrent={{ .Values.collector.read.maxConcurrentRequests }}"
            - "--history-duration={{ .Values.collector.history.duration }}"
            - "--history-max-series={{ .Values.collector.history.maxSeries }}"
            - "--history-max-points={{ .Values.collector.history.maxPoints }}"
            - "--history-max-response-series={{ .Values.collector.history.maxResponseSeries }}"
            - "--max-snapshot-bytes={{ int64 .Values.collector.ingestion.maxSnapshotBytes }}"
            - "--max-snapshot-containers={{ .Values.collector.ingestion.maxContainers }}"
            - "--max-snapshot-age={{ .Values.collector.ingestion.maxSnapshotAge }}"
            - "--max-snapshot-future-skew={{ .Values.collector.ingestion.maxFutureSkew }}"
            - "--store-max-nodes={{ .Values.collector.store.maxNodes }}"
            - "--store-max-containers={{ .Values.collector.store.maxContainers }}"
            - "--max-response-bytes={{ int64 .Values.collector.maxResponseBytes }}"
            - "--metrics-enabled={{ .Values.metrics.enabled }}"
            - "--metrics-include-namespaces={{ .Values.metrics.includeNamespaces }}"
            - "--metrics-include-pods={{ .Values.metrics.includePods }}"
            - "--metrics-include-containers={{ .Values.metrics.includeContainers }}"
            - "--metrics-include-diagnosis={{ .Values.metrics.includeDiagnosis }}"
            - "--metrics-include-events={{ .Values.metrics.includeEvents }}"
            - "--metrics-max-pods={{ .Values.metrics.maxPods }}"
            - "--metrics-max-containers={{ .Values.metrics.maxContainers }}"
          ports:
            - name: http
              containerPort: {{ .Values.collector.service.port }}
            - name: extension
              containerPort: {{ .Values.collector.ingestion.extensionPort }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: extension
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          securityContext:
            privileged: false
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: extension-tls
              mountPath: /var/run/kube-memlens/tls
              readOnly: true
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: extension-tls
          secret:
            secretName: {{ .Values.extensionTLS.secretName | quote }}
            defaultMode: 0440
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.agent.tokenExpirationSeconds }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
