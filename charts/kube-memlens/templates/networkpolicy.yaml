{{- if and .Values.collector.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-memlens-collector
  namespace: {{ .Values.namespace.name | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-collector
  policyTypes:
    - Ingress
  ingress:
    # The Pod-local HTTP listener serves health only in authenticated mode.
    # Keeping it reachable allows kubelet probes without exposing tenant data
    # through the Service.
    - ports:
        - port: http
          protocol: TCP
{{- if eq .Values.agent.ingestionMode "authenticated" }}
    # Managed control-plane source ranges are not portable. The aggregation
    # proxy certificate and delegated authorisation protect this TLS port.
    - ports:
        - port: extension
          protocol: TCP
{{- else }}
    # Legacy alpha ingestion remains limited to agents in this namespace.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-memlens-agent
      ports:
        - port: ingest
          protocol: TCP
{{- end }}
{{- end }}
