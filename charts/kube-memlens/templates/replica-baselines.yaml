{{- $replicas := .Values.replicaBaselines }}
{{- if not $replicas.enabled }}
{{- if $replicas.namespaces }}
{{- fail "replicaBaselines namespaces require replicaBaselines.enabled" }}
{{- end }}
{{- else }}
{{- if or (not .Values.collector.enabled) (empty $replicas.namespaces) (gt (len $replicas.namespaces) 64) }}
{{- fail "replicaBaselines requires the authenticated collector and 1 to 64 explicit namespaces" }}
{{- end }}
{{- $seen := dict }}
{{- range $replicas.namespaces }}
{{- if or (gt (len .) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .)) (hasKey $seen .) }}
{{- fail "replicaBaselines requires distinct valid namespaces" }}
{{- end }}
{{- $_ := set $seen . true }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-replica-viewer
rules:
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["pods", "pods/replicas", "workloads/replicas"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "controllerrevisions"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
{{- range $replicas.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-memlens-replica-source
  namespace: {{ . | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "controllerrevisions"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-memlens-replica-source
  namespace: {{ . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-memlens-replica-source
subjects:
  - kind: ServiceAccount
    name: kube-memlens-collector
    namespace: {{ $.Values.namespace.name | quote }}
{{- end }}
{{- end }}
