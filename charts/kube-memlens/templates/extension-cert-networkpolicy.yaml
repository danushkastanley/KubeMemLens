{{- if and .Values.collector.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-memlens-cert-bootstrap
  namespace: {{ .Values.namespace.name | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-cert-bootstrap
  # Install with the release before its certificate hook starts. The hook has
  # no inbound listener; separate namespace egress policies still apply.
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
