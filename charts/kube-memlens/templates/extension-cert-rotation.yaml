{{- if and .Values.collector.enabled (eq (include "kube-memlens.certRotationEnabled" .) "true") }}
{{- /*
The hooks rotate the serving certificate only on install, upgrade and rollback.
This CronJob runs the same binary on a schedule, so a release that is left
alone is still rotated before the certificate expires. Its account is not a
hook and exists for the life of the release: it may read and update the one
serving Secret and the one APIService, and create nothing.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-memlens-cert-rotation
  namespace: {{ .Values.namespace.name | quote }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-memlens-cert-rotation
  namespace: {{ .Values.namespace.name | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "kube-memlens.tlsSecretName" . | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-cert-rotation
rules:
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    resourceNames: ["v1alpha1.memory.kubememlens.io"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-memlens-cert-rotation
  namespace: {{ .Values.namespace.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-memlens-cert-rotation
subjects:
  - kind: ServiceAccount
    name: kube-memlens-cert-rotation
    namespace: {{ .Values.namespace.name | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-memlens-cert-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-memlens-cert-rotation
subjects:
  - kind: ServiceAccount
    name: kube-memlens-cert-rotation
    namespace: {{ .Values.namespace.name | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-memlens-cert-rotation
  namespace: {{ .Values.namespace.name | quote }}
spec:
  schedule: {{ include "kube-memlens.certRotationSchedule" . | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      {{- include "kube-memlens.certBootstrapJobSpec" (dict "root" . "serviceAccount" "kube-memlens-cert-rotation" "prepare" false "scheduled" true) | nindent 6 }}
{{- end }}
