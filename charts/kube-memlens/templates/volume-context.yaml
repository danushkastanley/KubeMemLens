{{- if and .Values.nodeContext.volumeStats (not (and .Values.nodeContext.enabled .Values.volumeContext.enabled)) }}
{{- fail "nodeContext.volumeStats requires nodeContext.enabled and volumeContext.enabled" }}
{{- end }}
{{- if .Values.volumeContext.enabled }}
{{- if not .Values.collector.enabled }}
{{- fail "volumeContext requires the authenticated collector" }}
{{- end }}
{{- if empty .Values.volumeContext.namespaces }}
{{- fail "volumeContext.namespaces must name at least one existing namespace" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-volume-binding-reader
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-memlens-volume-binding-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-memlens-volume-binding-reader
subjects:
  - kind: ServiceAccount
    name: kube-memlens-collector
    namespace: {{ .Values.namespace.name | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-volume-viewer
rules:
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["pods/volumes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get"]
{{- range .Values.volumeContext.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-memlens-volume-source
  namespace: {{ . | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-memlens-volume-source
  namespace: {{ . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-memlens-volume-source
subjects:
  - kind: ServiceAccount
    name: kube-memlens-collector
    namespace: {{ $.Values.namespace.name | quote }}
{{- end }}
{{- end }}
