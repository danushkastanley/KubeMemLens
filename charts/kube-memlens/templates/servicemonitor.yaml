{{- if and .Values.metrics.serviceMonitor.enabled (eq .Values.agent.ingestionMode "authenticated") }}
{{- fail "metrics.serviceMonitor requires agent.ingestionMode=legacy until the scraper is configured for the authenticated aggregated metrics resource" }}
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-memlens-collector
  namespace: {{ .Values.namespace.name | quote }}
{{- with .Values.metrics.serviceMonitor.labels }}
  labels:
{{ toYaml . | nindent 4 }}
{{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-collector
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
