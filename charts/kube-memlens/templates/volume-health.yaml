{{- if and .Values.volumeContext.health (not .Values.volumeContext.enabled) }}
{{- fail "volumeContext.health requires volumeContext.enabled" }}
{{- end }}
{{- if .Values.volumeContext.health }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-volume-health-source
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-memlens-volume-health-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-memlens-volume-health-source
subjects:
  - kind: ServiceAccount
    name: kube-memlens-collector
    namespace: {{ .Values.namespace.name | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-volume-backend-viewer
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get"]
{{- end }}
