apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-memlens-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-memlens-agent
subjects:
  - kind: ServiceAccount
    name: kube-memlens-agent
    namespace: {{ .Values.namespace.name | quote }}
