{{- if and .Values.collector.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-memlens-test
  namespace: {{ .Values.namespace.name | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-test
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
