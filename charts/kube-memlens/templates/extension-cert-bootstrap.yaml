{{- if .Values.collector.enabled }}
{{- $hookAnnotations := dict
      "helm.sh/hook" "post-install,post-upgrade,post-rollback"
      "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded,hook-failed" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-memlens-cert-bootstrap
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
{{ toYaml (merge (dict "helm.sh/hook-weight" "-30") $hookAnnotations) | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-memlens-cert-bootstrap
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
{{ toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookAnnotations) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.extensionTLS.secretName | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-cert-bootstrap
  annotations:
{{ toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookAnnotations) | nindent 4 }}
rules:
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    resourceNames: ["v1alpha1.memory.kubememlens.io"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-memlens-cert-bootstrap
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
{{ toYaml (merge (dict "helm.sh/hook-weight" "-10") $hookAnnotations) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-memlens-cert-bootstrap
subjects:
  - kind: ServiceAccount
    name: kube-memlens-cert-bootstrap
    namespace: {{ .Values.namespace.name | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-memlens-cert-bootstrap
  annotations:
{{ toYaml (merge (dict "helm.sh/hook-weight" "-10") $hookAnnotations) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-memlens-cert-bootstrap
subjects:
  - kind: ServiceAccount
    name: kube-memlens-cert-bootstrap
    namespace: {{ .Values.namespace.name | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-memlens-cert-bootstrap
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
{{ toYaml (merge (dict "helm.sh/hook-weight" "0") $hookAnnotations) | nindent 4 }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 150
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-memlens-cert-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: kube-memlens-cert-bootstrap
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ include "kube-memlens.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/memlens-cert-bootstrap"]
          args:
            - "--namespace={{ .Values.namespace.name }}"
            - "--secret={{ .Values.extensionTLS.secretName }}"
            - "--api-service=v1alpha1.memory.kubememlens.io"
            - "--service=kube-memlens-collector"
            - "--validity={{ mul (int .Values.extensionTLS.validityDays) 24 }}h"
            - "--rotate-before={{ .Values.extensionTLS.rotateBefore }}"
{{- if .Values.extensionTLS.forceRotate }}
            - "--force"
{{- end }}
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
