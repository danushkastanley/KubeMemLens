{{- include "kube-memlens.requireNamespace" . -}}
{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name | quote }}
{{- with .Values.namespace.podSecurityEnforce }}
  labels:
    pod-security.kubernetes.io/enforce: {{ . | quote }}
{{- end }}
{{- end }}
