{{- if .Values.nodeContext.enabled }}
{{- if not (and .Values.agent.enabled .Values.collector.enabled) }}
{{- fail "nodeContext requires both the deep agent and authenticated collector" }}
{{- end }}
{{- $ca := required "nodeContext.kubeletCAConfigMap is required" .Values.nodeContext.kubeletCAConfigMap }}
{{- $audience := required "nodeContext.kubeletAudience is required" .Values.nodeContext.kubeletAudience }}
{{- if or (empty .Values.nodeContext.apiServerCIDRs) (empty .Values.nodeContext.nodeCIDRs) }}
{{- fail "nodeContext.apiServerCIDRs and nodeContext.nodeCIDRs require qualified network ranges" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-memlens-node-context
  namespace: {{ .Values.namespace.name | quote }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-node-context-producer
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/stats"]
    verbs: ["get"]
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["ingestionepochs"]
    verbs: ["get"]
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["nodesnapshots"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-memlens-node-context-producer
subjects:
  - kind: ServiceAccount
    name: kube-memlens-node-context
    namespace: {{ .Values.namespace.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-memlens-node-context-producer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-memlens-node-context-viewer
rules:
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["nodecontexts"]
    verbs: ["get", "list"]
  - apiGroups: ["memory.kubememlens.io"]
    resources: ["nodecontexts/history"]
    verbs: ["get"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-memlens-node-context
  namespace: {{ .Values.namespace.name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-memlens-node-context
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-memlens-node-context
    spec:
      serviceAccountName: kube-memlens-node-context
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
{{ toYaml .Values.agent.nodeSelector | nindent 8 }}
{{- with .Values.agent.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-context
          image: {{ include "kube-memlens.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/memlens-node-context"]
          args:
            - "--publish"
            - "--node-name=$(NODE_NAME)"
            - "--kubelet-ca=/var/run/kubelet-trust/ca.crt"
            - "--kubelet-token-file=/var/run/kubelet-token/token"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.nodeContext.resources | nindent 12 }}
          volumeMounts:
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: kubelet-trust
              mountPath: /var/run/kubelet-trust
              readOnly: true
            - name: kubelet-token
              mountPath: /var/run/kubelet-token
              readOnly: true
      volumes:
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.agent.tokenExpirationSeconds }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: kubelet-trust
          configMap:
            name: {{ $ca | quote }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        - name: kubelet-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $audience | quote }}
                  expirationSeconds: {{ .Values.agent.tokenExpirationSeconds }}
{{- end }}
