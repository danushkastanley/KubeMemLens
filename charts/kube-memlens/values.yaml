image:
  repository: ghcr.io/danushkastanley/kube-memlens
  # Empty uses Chart.appVersion so packaged releases stay aligned.
  tag: ""
  # An exact sha256 digest takes precedence over tag. Use it for qualification
  # and other environments that require immutable workload artefacts.
  digest: ""
  pullPolicy: IfNotPresent
  # Secrets in the install namespace for a private registry, for example
  # [{name: registry-credentials}]. Applied to every Pod that runs this image.
  pullSecrets: []

namespace:
  create: false
  name: kube-memlens
  # Pod Security level to enforce on a namespace the chart creates. Empty
  # sets no label. The agent needs "privileged": it reads the node's cgroup
  # tree through a read-only hostPath volume, which baseline and restricted
  # forbid. The chart never changes this label unless you set it.
  podSecurityEnforce: ""

# Optional deep-mode producer; trust, audience and network ranges must be qualified.
# See profiles/node-context.yaml for explicit collector capacity and sizing.
nodeContext:
  enabled: false
  volumeStats: false
  topology:
    enabled: false
    cgroupRoot: /sys/fs/cgroup
  kubeletCAConfigMap: ""
  kubeletAudience: ""
  kubeletPort: 10250
  accountingConfigMap: ""
  apiServerCIDRs: []
  nodeCIDRs: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Optional namespace-scoped volume reads. Namespaces must already exist.
volumeContext:
  workloads: false
  enabled: false
  health: false
  namespaces: []

# Optional history query adapter. The operator owns the remote service and its
# immutable identity labels. Credentials come only from an existing Secret.
memoryHistory:
  enabled: false
  url: ""
  cluster: ""
  namespaces: []
  nodes: false
  workloads: false
  markers: false
  credentialsSecret: ""
  caKey: ""
  tokenKey: ""

# Optional owner-only incident records. Retained in collector memory only.
incidentSessions:
  enabled: false
  namespaces: []

# Optional local comparison of authorised workload replicas. No remote provider.
replicaBaselines:
  enabled: false
  namespaces: []

agent:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux
  # Add only the tolerations required for the Linux node pools being observed.
  tolerations: []
  cgroupRootHostPath: /sys/fs/cgroup
  interval: 5s
  tokenExpirationSeconds: 3600
  metrics:
    # The listener binds to Pod-local loopback and is not advertised for remote
    # scraping. Set false to remove even that local diagnostics endpoint.
    enabled: true
    port: 8082
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 128Mi
  # The agent's Go soft heap limit (GOMEMLIMIT) is set to 90% of
  # limits.memory when that is a whole number of Mi or Gi, so the agent
  # collects garbage before the kernel kills it. Other forms leave it unset.
  # Without a priority class the agent is an early eviction candidate under
  # the node memory pressure it exists to explain. system-node-critical is
  # usual for node agents; it needs a quota that allows it outside kube-system.
  priorityClassName: ""
  # Empty keeps the Kubernetes default of one node at a time. On large
  # clusters, for example: {type: RollingUpdate, rollingUpdate: {maxUnavailable: "10%"}}.
  updateStrategy: {}
  podAnnotations: {}
  affinity: {}
  probes:
    # Off by default: the probes need a listener on the Pod address, and the
    # agent otherwise listens only on loopback. It serves /livez and /healthz
    # and nothing else. /livez fails, and the kubelet restarts the agent, when
    # no scan has been attempted within livenessWindow.
    enabled: false
    port: 8083
    livenessWindow: 2m

collector:
  enabled: true
  # Additional placement labels; the collector always requires Linux.
  nodeSelector: {}
  # Multiple replicas would each hold an independent in-memory view.
  replicas: 1
  # Lifetime of the collector's own projected token. The agent's is set by
  # agent.tokenExpirationSeconds.
  tokenExpirationSeconds: 3600
  snapshotTTL: 30s
  read:
    # Aggregate construction is serialised inside the collector; this admission
    # ceiling bounds queued requests and their transport overhead.
    maxConcurrentRequests: 4
  history:
    duration: 15m
    maxSeries: 1000
    maxPoints: 181
    maxResponseSeries: 20
  ingestion:
    extensionPort: 8443
    maxConcurrentRequests: 4
    requestsPerSecondPerAgent: 1
    burstPerAgent: 2
    maxSnapshotBytes: 8388608
    maxContainers: 10000
    maxSnapshotAge: 2m
    maxFutureSkew: 30s
  store:
    maxNodes: 5000
    maxContainers: 100000
  maxResponseBytes: 16777216
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 256Mi
  service:
    # Pod-local health listener. The authenticated Service does not expose it.
    port: 8080
    # Authenticated Service endpoint; APIService and the connection test follow it.
    extensionPort: 443
    extensionPortName: https-extension

extensionTLS:
  # Who creates the aggregated API's serving CA, certificate and key.
  # chart: the chart creates them while it renders. Helm CLI only.
  # bootstrap: a Job creates them in the cluster, in a Secret named
  # <secretName>-bootstrap, and the chart renders no key material.
  source: chart
  secretName: kube-memlens-extension-tls
  validityDays: 365
  rotateBefore: 720h
  forceRotate: false

metrics:
  enabled: true
  includeNamespaces: true
  includePods: true
  # Container metrics are useful but can be high-cardinality in busy clusters.
  includeContainers: false
  includeDiagnosis: true
  # Memory event metrics are gauges from latest snapshots, not monotonic counters.
  includeEvents: true
  maxPods: 2000
  maxContainers: 5000
  prometheusRule:
    enabled: false
    labels: {}
    runbookBaseURL: https://github.com/danushkastanley/KubeMemLens/blob/main/docs/runbooks
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

security:
  privileged: false
  readOnlyRootFilesystem: true

networkPolicy:
  enabled: true

# The standard profile is cgroup-read focused and uses a read-only hostPath.
# Optional eBPF tracing is not implemented; any future tracer requires its own
# installation profile, security review, and benchmark gates.
