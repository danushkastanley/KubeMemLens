image:
  repository: ghcr.io/danushkastanley/kube-memlens
  # Empty uses Chart.appVersion so packaged releases stay aligned.
  tag: ""
  # An exact sha256 digest takes precedence over tag. Use it for qualification
  # and other environments that require immutable workload artefacts.
  digest: ""
  pullPolicy: IfNotPresent

namespace:
  create: false
  name: kube-memlens

agent:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux
  # Add only the tolerations required for the Linux node pools being observed.
  tolerations: []
  cgroupRootHostPath: /sys/fs/cgroup
  interval: 5s
  # The production path uses the Kubernetes aggregated API. Legacy direct HTTP
  # remains only for controlled alpha rollback on a trusted evaluation cluster.
  ingestionMode: authenticated
  collectorURL: http://kube-memlens-collector:8081
  tokenExpirationSeconds: 3600
  metrics:
    enabled: true
    port: 8082
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

collector:
  enabled: true
  # Multiple replicas would each hold an independent in-memory view.
  replicas: 1
  snapshotTTL: 30s
  read:
    # Aggregate construction is serialised inside the collector; this admission
    # ceiling bounds queued requests and their transport overhead.
    maxConcurrentRequests: 4
  history:
    duration: 15m
    maxSeries: 1000
    maxPoints: 180
    maxResponseSeries: 20
  ingestion:
    port: 8081
    extensionPort: 8443
    maxConcurrentRequests: 4
    requestsPerSecondPerAgent: 1
    burstPerAgent: 2
    maxSnapshotBytes: 4194304
    maxContainers: 10000
    maxSnapshotAge: 2m
    maxFutureSkew: 30s
  store:
    maxNodes: 5000
    maxContainers: 100000
  maxResponseBytes: 16777216
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  service:
    # Pod-local health listener. The authenticated Service does not expose it.
    port: 8080

extensionTLS:
  secretName: kube-memlens-extension-tls
  validityDays: 365
  rotateBefore: 720h
  forceRotate: false

metrics:
  enabled: true
  includeNamespaces: true
  includePods: true
  # Container metrics are useful but can be high-cardinality in busy clusters.
  includeContainers: false
  includeDiagnosis: true
  # Memory event metrics are gauges from latest snapshots, not monotonic counters.
  includeEvents: true
  maxPods: 2000
  maxContainers: 5000
  # Applied only to the direct metrics Service in explicit legacy mode.
  serviceAnnotations: {}
  serviceMonitor:
    # Direct Service scraping is available only in explicit legacy mode.
    # Authenticated scrapers use the aggregated metrics resource and its
    # separately bound ClusterRole.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    runbookBaseURL: https://github.com/danushkastanley/kube-memlens/blob/main/docs/runbooks
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

security:
  privileged: false
  readOnlyRootFilesystem: true

networkPolicy:
  enabled: true

# The standard profile is cgroup-read focused and uses a read-only hostPath.
# Optional eBPF tracing is not implemented; any future tracer requires its own
# installation profile, security review, and benchmark gates.
